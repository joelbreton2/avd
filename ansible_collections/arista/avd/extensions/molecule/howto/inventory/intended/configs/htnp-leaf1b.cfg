!
no enable password
no aaa root
!
username admin privilege 15 role network-admin nopassword
username arista privilege 15 role network-admin secret sha512 $6$Enl0WfE32FthwyiJ$yTyGaEJ2uPKLU.F7314YtB7J1jrzrMi7ogXIRTEHQfLdLgKWWmr1UvNlZLN6AyuxET7G5aH3AI9OYRzxVTkB1.
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname htnp-leaf1b
ip domain lookup vrf MGMT source-interface Management1
ip name-server vrf MGMT 192.168.1.1
!
spanning-tree mode mstp
spanning-tree mst 0 priority 4096
!
vlan 100
   name WebServers
!
vlan 200
   name VoiceVLAN
!
vlan 300
   name DataVLAN
!
vrf instance MGMT
!
vrf instance VRF_WEB
!
vrf instance VRF_VOICE
!
vrf instance VRF_DATA
!
interface Ethernet1
   description P2P_UPLINK
   no shutdown
   mtu 1500
   no switchport
   ip address 10.255.255.12/31
!
interface Ethernet10
   description Web Server Ports
   no shutdown
   switchport access vlan 100
   switchport mode access
   switchport
   spanning-tree portfast
   storm-control all level 10
!
interface Ethernet11
   description Web Server Ports
   no shutdown
   switchport access vlan 100
   switchport mode access
   switchport
   spanning-tree portfast
   storm-control all level 10
!
interface Ethernet12
   description Web Server Ports
   no shutdown
   switchport access vlan 100
   switchport mode access
   switchport
   spanning-tree portfast
   storm-control all level 10
!
interface Ethernet13
   description Web Server Ports
   no shutdown
   switchport access vlan 100
   switchport mode access
   switchport
   spanning-tree portfast
   storm-control all level 10
!
interface Ethernet14
   description Web Server Ports
   no shutdown
   switchport access vlan 100
   switchport mode access
   switchport
   spanning-tree portfast
   storm-control all level 10
!
interface Ethernet15
   description Web Server Ports
   no shutdown
   switchport access vlan 100
   switchport mode access
   switchport
   spanning-tree portfast
   storm-control all level 10
!
interface Ethernet20
   description Trunk Uplink Port
   no shutdown
   switchport trunk allowed vlan 100,200,300
   switchport trunk native vlan 1
   switchport mode trunk
   switchport
   spanning-tree portfast network
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.255.0.11/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.16.1.202/24
!
interface Vlan100
   description WebServers
   no shutdown
   vrf VRF_WEB
   ip address virtual 10.100.100.1/24
!
interface Vlan200
   description VoiceVLAN
   no shutdown
   vrf VRF_VOICE
   ip address virtual 10.200.200.1/24
!
interface Vlan300
   description DataVLAN
   no shutdown
   vrf VRF_DATA
   ip address virtual 10.300.300.1/24
!
no ip routing vrf MGMT
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT 0.pool.ntp.org prefer
!
end

